<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a5c2a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="description" content="高校校徽合成小游戏 · 合成武汉大学">
    <title>合成武汉大学</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #22301f;
            background: #f2f7ee;
        }

        * {
            box-sizing: border-box;
        }

        [hidden] {
            display: none !important;
        }

        html, body {
            margin: 0;
            min-height: 100%;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            overscroll-behavior: none;
            background-image: linear-gradient(to bottom, #f7fbf2 0%, #e7efe0 100%);
        }

        button, canvas {
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font: inherit;
            line-height: 1;
            color: inherit;
            margin: 0;
            padding: 0;
            border: 0;
            background: none;
            appearance: none;
            -webkit-appearance: none;
        }

            button:focus, canvas:focus {
                outline: none;
            }

        .app {
            margin: 0 auto;
            padding: env(safe-area-inset-top) 0 0;
            max-width: 440px;
        }

        .topbar {
            height: 54px;
            display: grid;
            grid-template-columns: minmax(0,1fr) auto auto auto;
            align-items: center;
            gap: 6px;
            padding: 0 10px;
        }

        .brand {
            min-width: 0;
        }

            .brand h1 {
                margin: 0;
                font-size: 21px;
                line-height: 1.1;
                letter-spacing: -0.02em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                color: #0a5c2a;
            }

            .brand p {
                margin: 3px 0 0;
                color: #7c8a72;
                font-size: 12px;
                font-weight: 700;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

        .metric {
            min-width: 46px;
            height: 42px;
            padding: 3px 5px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(34,48,31,.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

            .metric span {
                color: #8a977f;
                font-size: 11px;
                font-weight: 700;
                letter-spacing: .05em;
                line-height: 1;
            }

            .metric strong {
                font-size: 16px;
                font-variant-numeric: tabular-nums;
                line-height: 1.2;
            }

        .metric-score strong {
            color: #b8860b;
        }

        .icon-button {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(34,48,31,.08);
            display: grid;
            place-items: center;
            cursor: pointer;
        }

            .icon-button:active {
                transform: translateY(1px) scale(.98);
            }

        .restart-button {
            min-width: 46px;
            height: 42px;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: 0 1px 3px rgba(34,48,31,.08);
            font-size: 12px;
            font-weight: 800;
            color: #0a5c2a;
            cursor: pointer;
            padding: 0 8px;
        }

            .restart-button:active {
                transform: translateY(1px) scale(.98);
            }

        .board {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            overflow: hidden;
            isolation: isolate;
            background: url("assets/whu-campus.jpeg") center / cover no-repeat #e7efe0;
            box-shadow: 0 0 0 1px rgba(34,48,31,.06) inset;
        }

        #gameCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
            cursor: crosshair;
        }

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 5;
            padding: 22px;
            background: rgba(246,251,240,.94);
            display: grid;
            place-items: center;
        }

        .overlay-card {
            width: 100%;
            max-width: 320px;
            padding: 24px 22px;
            border: 1px solid #d6e2cc;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(34,48,31,.14);
            text-align: center;
        }

        .overlay h2 {
            margin: 0;
            font-size: 26px;
            line-height: 1.25;
            letter-spacing: -0.03em;
            color: #22301f;
        }

        .confirm-copy {
            margin: 10px 0 18px;
            color: #7c8a72;
            font-size: 15px;
            line-height: 1.45;
        }

        .result-row {
            margin-bottom: 14px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

            .result-row > div {
                padding: 11px 8px;
                border-radius: 13px;
                background: #f2f7ee;
            }

                .result-row > div > span {
                    display: block;
                    margin-bottom: 4px;
                    color: #8a977f;
                    font-size: 11px;
                    font-weight: 700;
                }

                .result-row > div > strong {
                    display: block;
                    color: #0a5c2a;
                    font-size: 19px;
                }

        .highest-item {
            width: 64px;
            height: 64px;
            margin: 2px auto 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-weight: 800;
            color: #fff;
            font-size: 15px;
            text-shadow: 0 1px 2px rgba(0,0,0,.2);
        }

        .new-record {
            margin: -4px 0 13px;
            color: #c0392b;
            font-weight: 800;
        }

        .confirm-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 9px;
        }

        .game-over-actions {
            grid-template-columns: 1fr;
        }

        .btn {
            height: 44px;
            border-radius: 13px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
        }

            .btn:active {
                transform: translateY(1px) scale(.98);
            }

        .btn-secondary {
            background: #eef3ea;
            color: #4c5a44;
        }

        .btn-primary {
            background: #0a7c37;
            color: #fff;
        }

        .footer {
            padding: 8px 10px;
            color: #9aa894;
            font-size: 11px;
            text-align: center;
            line-height: 1.5;
        }

        .sound-icon {
            position: relative;
            width: 20px;
            height: 18px;
            display: block;
            color: #4c5a44;
        }

            .sound-icon::before {
                position: absolute;
                top: 1px;
                left: 1px;
                width: 13px;
                height: 16px;
                background: currentColor;
                clip-path: polygon(0 36%,30% 36%,72% 5%,72% 95%,30% 64%,0 64%);
                content: "";
            }

            .sound-icon::after {
                position: absolute;
                top: 4px;
                right: 0;
                width: 6px;
                height: 10px;
                border-right: 2px solid currentColor;
                border-radius: 0 50% 50% 0;
                content: "";
            }

            .sound-icon.is-muted::after {
                top: 8px;
                right: 0;
                width: 19px;
                height: 2px;
                border: 0;
                border-radius: 999px;
                background: currentColor;
                transform: rotate(-45deg);
            }
    </style>
</head>
<body>
    <main class="app">
        <header class="topbar">
            <div class="brand">
                <h1>合成武汉大学</h1>
                <p>左右拖动 · 松手落下</p>
            </div>
            <div class="metric metric-score"><span>得分</span><strong id="score">0</strong></div>
            <div class="metric"><span>最高</span><strong id="bestScore">0</strong></div>
            <div style="display:flex;gap:5px;align-items:center;">
                <button class="icon-button" id="soundButton" type="button" aria-label="关闭声音" aria-pressed="true"><span class="sound-icon" id="soundIcon"></span></button>
                <button class="restart-button" id="restartButton" type="button">重开</button>
            </div>
        </header>

        <div class="board">
            <canvas id="gameCanvas"></canvas>

            <div class="overlay" id="gameOverOverlay" role="dialog" aria-modal="true" hidden>
                <div class="overlay-card">
                    <h2>本局结束</h2>
                    <p class="confirm-copy" id="gameOverMessage">差一点就更大了</p>
                    <div class="result-row">
                        <div><span>最高合成</span><div class="highest-item" id="highestItem">—</div></div>
                        <div><span>得分</span><strong id="finalScore">0</strong></div>
                    </div>
                    <p class="new-record" id="newRecord" hidden>新纪录！</p>
                    <div class="confirm-actions game-over-actions">
                        <button class="btn btn-primary" id="againButton" type="button">再合一次</button>
                    </div>
                </div>
            </div>

            <div class="overlay" id="restartConfirmOverlay" role="dialog" aria-modal="true" hidden>
                <div class="overlay-card">
                    <h2>重新开始？</h2>
                    <p class="confirm-copy">当前进度将会丢失</p>
                    <div class="confirm-actions">
                        <button class="btn btn-secondary" id="restartCancelButton" type="button">取消</button>
                        <button class="btn btn-primary" id="restartConfirmButton" type="button">重新开始</button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="footer">合成武汉大学 · 两个相同的校徽碰撞会合成更大的学校</footer>
    </main>

    <script>(function () {
  "use strict";

  /* ===== 等级链：从小到大，武汉大学最大 ===== */
  var LEVELS = [
    { name: "川大", full: "四川大学",     color: "#004098", radius: 22,  asset: "assets/scu.svg" },
    { name: "人大", full: "中国人民大学", color: "#00337d", radius: 27, asset: "assets/ruc.svg" },
    { name: "清北", full: "清华北京大学", color: "#660874", radius: 38, asset: "assets/thpku.svg" },
    { name: "哈佛", full: "哈佛大学",     color: "#94070a", radius: 46, asset: "assets/harvard.svg" },
    { name: "麻省理工", full: "麻省理工学院",     color: "#660874", radius: 58, asset: "assets/mit.svg" },
    { name: "华科", full: "华中科技大学",     color: "#c8102e", radius: 82,  asset: "assets/hust.svg" },
    { name: "武大", full: "武汉大学", color: "#0a7c37", radius: 220, asset: "assets/whu.svg", crown: true }

  ];

  /* ===== 预加载校徽图片（加载失败时绘制自动回退为文字） ===== */
  var IMAGES = [];
  LEVELS.forEach(function (L, i) {
    var img = new Image();
    img.src = L.asset;
    IMAGES[i] = img;
  });

  /* ===== 物理 / 世界常量 ===== */
  var WORLD_W = 640;
  var WORLD_H = 960;
  var FLOOR = WORLD_H;
  var LEFT_WALL = 0;
  var RIGHT_WALL = WORLD_W;
  var DANGER_LINE = 128;
  var GRAVITY = 2100;
  var WALL_RESTITUTION = 0.18;
  var CIRCLE_RESTITUTION = 0.08;
  var FRICTION = 0.20;
  var GROUND_FRICTION = 2.0;   // 地面摩擦（每秒），减缓落地后的水平滑动
  var DANGER_DELAY = 0.9;
  var GRACE = 0.75;
  var SPAWN_LEVEL_COUNT = 3;          // 随机投放前 3 级（川大~清北）
  var MAX_LEVEL = LEVELS.length - 1;  // 武汉大学
  var DROP_COOLDOWN = 0.42;

  var canvas = document.getElementById("gameCanvas");
  var ctx = canvas.getContext("2d");
  var scoreEl = document.getElementById("score");
  var bestEl = document.getElementById("bestScore");
  var finalScoreEl = document.getElementById("finalScore");
  var highestItemEl = document.getElementById("highestItem");
  var gameOverMessageEl = document.getElementById("gameOverMessage");
  var newRecordEl = document.getElementById("newRecord");
  var gameOverOverlay = document.getElementById("gameOverOverlay");
  var restartConfirmOverlay = document.getElementById("restartConfirmOverlay");
  var againButton = document.getElementById("againButton");
  var restartButton = document.getElementById("restartButton");
  var restartCancelButton = document.getElementById("restartCancelButton");
  var restartConfirmButton = document.getElementById("restartConfirmButton");
  var soundButton = document.getElementById("soundButton");
  var soundIcon = document.getElementById("soundIcon");

  var STORAGE_KEY = "merge-sysu:best:v1";

  var items = [];
  var particles = [];
  var floaters = [];
  var score = 0;
  var bestScore = 0;
  var bestBeforeGame = 0;
  var currentLevel = 0;
  var aimX = WORLD_W / 2;
  var readyToDrop = true;
  var dropCooldown = 0;
  var hasDroppedItem = false;
  var maxLevelReached = 0;
  var hasMergedHighest = false;
  var dangerTimer = 0;
  var mode = "playing";   // playing | ending | gameover | confirming
  var modeBeforeConfirm = "playing";
  var nextItemId = 1;
  var activePointer = null;
  var tiltX = 0;   // 陀螺仪水平重力分量（左右倾斜映射，-1.2~1.2）
  var soundEnabled = true;
  var audioCtx = null;
  var lastTime = 0;
  var rafId = null;
  var dpr = 1;
  var scaleX = 1;
  var scaleY = 1;

  /* ===== 工具 ===== */
  function clamp(v, lo, hi) { return v < lo ? lo : (v > hi ? hi : v); }
  function randLevel() { return Math.floor(Math.random() * SPAWN_LEVEL_COUNT); }
  function levelScore(level) { return Math.pow(2, level); }

  function loadBest() {
    try {
      var v = parseInt(window.localStorage.getItem(STORAGE_KEY), 10);
      return Number.isFinite(v) && v >= 0 ? v : 0;
    } catch (e) { return 0; }
  }
  function saveBest() {
    try { window.localStorage.setItem(STORAGE_KEY, String(bestScore)); } catch (e) {}
  }

  /* ===== 物体 ===== */
  function makeItem(level, x, y, vx, vy) {
    var r = LEVELS[level].radius;
    return {
      id: nextItemId++, level: level, radius: r, mass: r * r, invMass: 1 / (r * r),
      x: x, y: y, vx: vx || 0, vy: vy || 0, age: 0, grace: GRACE, pop: level === MAX_LEVEL ? 0.25 : 0
    };
  }

  /* ===== 游戏流程 ===== */
  function startGame() {
    items = []; particles = []; floaters = [];
    score = 0; hasDroppedItem = false; maxLevelReached = 0; hasMergedHighest = false;
    nextItemId = 1; dangerTimer = 0; activePointer = null;
    bestBeforeGame = bestScore;
    currentLevel = randLevel();
    aimX = WORLD_W / 2; readyToDrop = true; dropCooldown = 0;
    mode = "playing";
    gameOverOverlay.hidden = true;
    restartConfirmOverlay.hidden = true;
    newRecordEl.hidden = true;
    updateScore();
    requestFrame();
  }

  function dropCurrent() {
    if (mode !== "playing" || !readyToDrop) return;
    aimX = limitAimX(aimX);
    items.push(makeItem(currentLevel, aimX, -LEVELS[currentLevel].radius - 6, 0, 160));
    hasDroppedItem = true;
    maxLevelReached = Math.max(maxLevelReached, currentLevel);
    readyToDrop = false;
    dropCooldown = DROP_COOLDOWN;
    playDropSound();
  }

  function limitAimX(v) {
    var r = LEVELS[currentLevel].radius;
    return clamp(v, LEFT_WALL + r + 2, RIGHT_WALL - r - 2);
  }

  function beginFailure() {
    if (mode !== "playing") return;
    mode = "ending";
    playGameOverSound();
    // 简短爆炸后显示结束面板
    setTimeout(finishGame, 320);
  }

  function finishGame() {
    if (mode !== "ending") return;
    mode = "gameover";
    var madeRecord = score > bestBeforeGame && score > 0;
    finalScoreEl.textContent = String(score);
    var top = LEVELS[maxLevelReached];
    highestItemEl.textContent = top.name;
    highestItemEl.style.background = top.color;
    highestItemEl.style.boxShadow = top.crown ? "0 0 0 3px #e6b422" : "none";
      gameOverMessageEl.textContent = hasMergedHighest ? "已合成华中科技大学！" : "差一点就更大了";
    newRecordEl.hidden = !madeRecord;
    gameOverOverlay.hidden = false;

  function openConfirm() {
    modeBeforeConfirm = mode;
    mode = "confirming";
    restartConfirmOverlay.hidden = false;
  }
  function closeConfirm(confirmed) {
    restartConfirmOverlay.hidden = true;
    if (confirmed) { startGame(); return; }
    mode = modeBeforeConfirm;
    requestFrame();
  }

  /* ===== 分数 ===== */
  function addMergeScore(level, x, y) {
    var pts = levelScore(level);
    score += pts;
    if (score > bestScore) { bestScore = score; saveBest(); }
    floaters.push({ x: x, y: y, text: "+" + pts, life: 0.7, maxLife: 0.7 });
    updateScore();
  }
  function updateScore() {
    scoreEl.textContent = String(score);
    bestEl.textContent = String(bestScore);
  }

  /* ===== 粒子 ===== */
 function addBurst(x, y, color) {
  var n = 8 + Math.floor(Math.random() * 6);
  for (var i = 0; i < n; i++) {
    var a = Math.random() * Math.PI * 2;
    var sp = 60 + Math.random() * 110;
    particles.push({
      x: x, y: y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 40,
      r: 2 + Math.random() * 3,
      color: color,
      life: 0,                                   // 从 0 开始
      maxLife: 0.45 + Math.random() * 0.2        // 每条粒子寿命略有差异
    });
  }
  if (particles.length > 200) particles.splice(0, particles.length - 200);
}
  /* ===== 物理 ===== */
  function physicsStep(dt) {
    var i, j, b;
    for (i = 0; i < items.length; i++) {
      b = items[i];
      b.vy += GRAVITY * dt;
      b.vx += GRAVITY * tiltX * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.age += dt;
      b.pop = Math.max(0, b.pop - dt);
      // 墙壁
      if (b.x - b.radius < LEFT_WALL) { b.x = LEFT_WALL + b.radius; if (b.vx < 0) b.vx = -b.vx * WALL_RESTITUTION; }
      if (b.x + b.radius > RIGHT_WALL) { b.x = RIGHT_WALL - b.radius; if (b.vx > 0) b.vx = -b.vx * WALL_RESTITUTION; }
      if (b.y + b.radius > FLOOR) { b.y = FLOOR - b.radius; if (b.vy > 0) b.vy = -b.vy * WALL_RESTITUTION; b.vx *= Math.max(0, 1 - GROUND_FRICTION * dt); }
      // 微阻尼
      b.vx *= 0.999;
    }

    var merges = [];
    var mergeSet = {};
    for (var iter = 0; iter < 3; iter++) {
      for (i = 0; i < items.length; i++) {
        var a = items[i];
        for (j = i + 1; j < items.length; j++) {
          b = items[j];
          var dx = b.x - a.x, dy = b.y - a.y;
          var minDist = a.radius + b.radius;
          var distSq = dx * dx + dy * dy;
          // 合成判定先于物理：同等级且足够接近（含一点容差）→ 立即合成，
          // 不做弹开物理，避免两个球被推开后永远合不上。
          if (a.level === b.level && a.level < MAX_LEVEL) {
            var mergeTolerance = 0.6;
            var mergeDist = minDist + mergeTolerance;
            if (distSq < mergeDist * mergeDist) {
              var key = Math.min(a.id, b.id) + ":" + Math.max(a.id, b.id);
              if (!mergeSet[key]) { mergeSet[key] = true; merges.push([a, b]); }
            }
            continue;
          }
          // 不同等级走物理碰撞：只有真正重叠(穿透)才处理
          if (distSq >= minDist * minDist) continue;
          var dist = Math.sqrt(distSq);
          if (dist < 0.0001) { dx = (a.id < b.id ? 1 : -1); dy = 0; dist = 0.0001; }
          var nx = dx / dist, ny = dy / dist;
          var overlap = minDist - dist;
          // 位置修正（按质量分配）
          var invSum = a.invMass + b.invMass;
          var corr = overlap / invSum;
          a.x -= nx * corr * a.invMass;
          a.y -= ny * corr * a.invMass;
          b.x += nx * corr * b.invMass;
          b.y += ny * corr * b.invMass;
          // 速度冲量
          var rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          var velN = rvx * nx + rvy * ny;
          if (velN < 0) {
            var jimp = -(1 + CIRCLE_RESTITUTION) * velN / invSum;
            a.vx -= jimp * nx * a.invMass; a.vy -= jimp * ny * a.invMass;
            b.vx += jimp * nx * b.invMass; b.vy += jimp * ny * b.invMass;
          }
          // 摩擦
          var tx = rvx - velN * nx, ty = rvy - velN * ny;
          var tl = Math.sqrt(tx * tx + ty * ty);
          if (tl > 0.0001) {
            tx /= tl; ty /= tl;
            var jt = -(rvx * tx + rvy * ty) / invSum;
            var lim = FRICTION * Math.abs(jimp);
            jt = clamp(jt, -lim, lim);
            a.vx -= tx * jt * a.invMass; a.vy -= ty * jt * a.invMass;
            b.vx += tx * jt * b.invMass; b.vy += ty * jt * b.invMass;
          }
        }
      }
    }

    // 应用合成
    if (merges.length) {
      var consumed = {};
      var created = [];
      for (i = 0; i < merges.length; i++) {
        var p = merges[i];
        var a0 = p[0], b0 = p[1];
        if (consumed[a0.id] || consumed[b0.id]) continue;
        consumed[a0.id] = true; consumed[b0.id] = true;
        var tm = a0.mass + b0.mass;
        var mx = (a0.x * a0.mass + b0.x * b0.mass) / tm;
        var my = (a0.y * a0.mass + b0.y * b0.mass) / tm;
        var mvx = (a0.vx * a0.mass + b0.vx * b0.mass) / tm;
        var mvy = (a0.vy * a0.mass + b0.vy * b0.mass) / tm;
        var nl = a0.level + 1;
        addMergeScore(nl, mx, my);
        addBurst(mx, my, LEVELS[a0.level].color);
        playMergeSound(nl);
        mx = clamp(mx, LEFT_WALL + LEVELS[nl].radius, RIGHT_WALL - LEVELS[nl].radius);
        my = Math.min(my, FLOOR - LEVELS[nl].radius);
        created.push(makeItem(nl, mx, my, mvx * 0.5, mvy * 0.5));
        if (nl === MAX_LEVEL) { hasMergedHighest = true; }
        maxLevelReached = Math.max(maxLevelReached, nl);
      }
      if (Object.keys(consumed).length) {
        items = items.filter(function (b) { return !consumed[b.id]; });
        items = items.concat(created);
      }
    }
  }

  function updateDanger(dt) {
    var crossed = false;
    for (var i = 0; i < items.length; i++) {
      var b = items[i];
      if (b.age < b.grace) continue;
      if (b.y - b.radius < DANGER_LINE) { crossed = true; break; }
    }
    if (crossed) dangerTimer += dt; else dangerTimer = Math.max(0, dangerTimer - dt * 2.8);
    if (dangerTimer >= DANGER_DELAY) { beginFailure(); }
  }

  function updateEffects(dt) {
    var i;
    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += 300 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (i = floaters.length - 1; i >= 0; i--) {
      var f = floaters[i];
      f.life -= dt; f.y -= 36 * dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }
  }

  function tick(dt) {
    if (mode === "playing") {
      if (dropCooldown > 0) {
        dropCooldown -= dt;
        if (dropCooldown <= 0) { currentLevel = randLevel(); aimX = limitAimX(aimX); readyToDrop = true; }
      }
      physicsStep(dt);
      updateDanger(dt);
      updateEffects(dt);
    }
  }

  /* ===== 渲染 ===== */
  function syncCanvas() {
    var rect = canvas.getBoundingClientRect();
    dpr = clamp(window.devicePixelRatio || 1, 1, 2.5);
    var w = Math.max(1, rect.width), h = Math.max(1, rect.height);
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scaleX = w / WORLD_W;
    scaleY = h / WORLD_H;
  }

  function drawBadge(x, y, radius, level, alpha, pop) {
    var L = LEVELS[level];
    var popScale = pop > 0 ? 1 + pop * 1.4 : 1;
    var r = radius * popScale;
    var bodyR = r - 1.5;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    // 白色外圈
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    // 主体底色（统一白色）
    ctx.beginPath(); ctx.arc(0, 0, bodyR, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff"; ctx.fill();
    // 校徽图片（圆形裁剪）：加载完成后绘制，否则回退为文字
    var img = IMAGES[level];
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, bodyR, 0, Math.PI * 2);
      ctx.clip();
      ctx.drawImage(img, -bodyR, -bodyR, bodyR * 2, bodyR * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = L.color;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      var chars = L.name.length;
      var fs = radius * (chars <= 2 ? 0.5 : chars <= 3 ? 0.42 : 0.34);
      ctx.font = "700 " + fs + "px system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.shadowColor = "rgba(0,0,0,.18)"; ctx.shadowBlur = 2; ctx.shadowOffsetY = 1;
      ctx.fillText(L.name, 0, 1);
    }
    if (L.crown) {
      ctx.beginPath(); ctx.arc(0, 0, r - 4, 0, Math.PI * 2);
      ctx.strokeStyle = "#e6b422"; ctx.lineWidth = 2.5; ctx.stroke();
    }
    ctx.restore();
  }

  function drawDangerLine() {
    var near = dangerTimer > 0 || (mode === "playing" && dangerNear());
    ctx.save();
    ctx.setLineDash([7, 8]);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = near ? "rgba(220,60,60,.85)" : "rgba(120,120,120,.4)";
    ctx.beginPath(); ctx.moveTo(LEFT_WALL, DANGER_LINE); ctx.lineTo(RIGHT_WALL, DANGER_LINE); ctx.stroke();
    ctx.restore();
  }
  function dangerNear() {
    for (var i = 0; i < items.length; i++) {
      var b = items[i];
      if (b.age >= b.grace && b.y - b.radius < DANGER_LINE + 70) return true;
    }
    return false;
  }

  function drawAimGuide() {
    if (mode !== "playing" || !readyToDrop) return;
    var r = LEVELS[currentLevel].radius;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 6]);
    ctx.beginPath(); ctx.moveTo(aimX, 0); ctx.lineTo(aimX, r + 26); ctx.stroke();
    ctx.restore();
    drawBadge(aimX, r + 8, r, currentLevel, 0.85, 0);
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, 0);
    ctx.save();

    drawDangerLine();
    drawAimGuide();
    for (var i = 0; i < items.length; i++) {
      var b = items[i];
      drawBadge(b.x, b.y, b.radius, b.level, 1, b.pop);
    }
    // 粒子
    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.save();
      ctx.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    // 加分浮字
    for (i = 0; i < floaters.length; i++) {
      var f = floaters[i];
      ctx.save();
      ctx.globalAlpha = clamp(f.life / f.maxLife, 0, 1);
      ctx.fillStyle = "#b8860b";
      ctx.font = "800 20px system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(f.text, f.x, f.y);
      ctx.restore();
    }
    ctx.restore();
  }

  /* ===== 主循环 ===== */
  function frame(now) {
    rafId = null;
    if (document.hidden) return;
    var dt = lastTime === 0 ? 1 / 60 : Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    if (mode === "playing" || mode === "ending") {
      var steps = 1;
      var sub = dt / steps;
      for (var s = 0; s < steps; s++) tick(sub);
    }
    render();
    if (mode === "playing" || mode === "ending") requestFrame();
  }
  function requestFrame() {
    if (rafId === null && !document.hidden) rafId = requestAnimationFrame(frame);
  }

  /* ===== 指针输入 ===== */
  function eventWorldX(e) {
    var rect = canvas.getBoundingClientRect();
    return (e.clientX - rect.left) / scaleX;
  }
  canvas.addEventListener("pointerdown", function (e) {
    if (mode !== "playing" || !readyToDrop || activePointer !== null) return;
    activePointer = e.pointerId;
    aimX = limitAimX(eventWorldX(e));
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    ensureAudio();
    if (e.cancelable) e.preventDefault();
  });
  canvas.addEventListener("pointermove", function (e) {
    if (e.pointerId === activePointer || (activePointer === null && e.pointerType === "mouse")) {
      if (mode === "playing" && readyToDrop) aimX = limitAimX(eventWorldX(e));
      if (e.cancelable) e.preventDefault();
    }
  });
  function finishGesture(e, shouldDrop) {
    if (e.pointerId !== activePointer) return;
    activePointer = null;
    try { if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId); } catch (err) {}
    if (shouldDrop) dropCurrent();
    if (e.cancelable) e.preventDefault();
  }
  canvas.addEventListener("pointerup", function (e) { finishGesture(e, true); });
  canvas.addEventListener("pointercancel", function (e) { finishGesture(e, false); });

  /* ===== 声音（可选，静默降级） ===== */
  function ensureAudio() {
    if (!soundEnabled) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!audioCtx && AC) audioCtx = new AC();
      if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function tone(freq, dur, vol, type, delay) {
    if (!soundEnabled || !audioCtx) return;
    try {
      var t0 = audioCtx.currentTime + (delay || 0);
      var o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type || "sine"; o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + dur + 0.02);
    } catch (e) {}
  }
  function playDropSound() { tone(200, 0.07, 0.03, "sine", 0); }
  function playMergeSound(level) { var f = 300 * Math.pow(1.12, Math.min(level, 11)); tone(f, 0.12, 0.05, "sine", 0); tone(f * 1.5, 0.09, 0.03, "triangle", 0.05); }
  function playGameOverSound() { tone(240, 0.2, 0.04, "sine", 0); tone(180, 0.26, 0.035, "sine", 0.15); }
  function updateSoundIcon() {
    soundIcon.classList.toggle("is-muted", !soundEnabled);
    soundButton.setAttribute("aria-label", soundEnabled ? "关闭声音" : "开启声音");
    soundButton.setAttribute("aria-pressed", String(soundEnabled));
  }

  /* ===== 事件绑定 ===== */
  againButton.addEventListener("click", startGame);
  restartButton.addEventListener("click", function () { if (mode === "playing") openConfirm(); });
  restartCancelButton.addEventListener("click", function () { closeConfirm(false); });
  restartConfirmButton.addEventListener("click", function () { closeConfirm(true); });
  soundButton.addEventListener("click", function () {
    soundEnabled = !soundEnabled;
    updateSoundIcon();
    if (soundEnabled) { ensureAudio(); tone(440, 0.08, 0.035, "sine", 0); }
  });

  /* ===== 陀螺仪：手机倾斜映射为水平重力 ===== */
  var gyroAsked = false;

  function onDeviceOrientation(e) {
    if (e.gamma == null) return;
    var g = e.gamma;   // 左右倾斜角（度），-90 ~ 90
    tiltX = clamp(g / 45, -1.2, 1.2);
  }

  function requestGyroPermission() {
    if (gyroAsked) return;
    gyroAsked = true;
    try {
      if (typeof DeviceOrientationEvent === "undefined") return;
      if (typeof DeviceOrientationEvent.requestPermission !== "function") return; // Android/桌面/旧iOS 无需授权
      var p = DeviceOrientationEvent.requestPermission();
      if (p && typeof p.then === "function") { p.then(function () {}).catch(function () {}); }
    } catch (e) {}
  }

  window.addEventListener("deviceorientation", onDeviceOrientation);
  // iOS 必须在用户手势里请求权限；touchstart 是 iOS 上最可靠的触发时机
  canvas.addEventListener("touchstart", requestGyroPermission, { passive: true });

  window.addEventListener("resize", function () { syncCanvas(); render(); });
  window.addEventListener("blur", function () { activePointer = null; });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) return;
    lastTime = 0; syncCanvas(); render(); requestFrame();
  });

  /* ===== 启动 ===== */
  bestScore = loadBest();
  bestEl.textContent = String(bestScore);
  updateSoundIcon();
  syncCanvas();
  startGame();
};</script>
</body>
</html>
